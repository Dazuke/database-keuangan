<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeCash</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <div class="overlay"></div>

  <div class="container">

    <div class="atm-card">
      <div>
        <p class="mini-text">TOTAL SALDO</p>
        <h1 id="totalBalance">Rp0</h1>
      </div>

      <div class="live-box">
        <span class="live-dot"></span>
        LIVE MONEY
      </div>
    </div>

    <div class="progress-section glass">
      <div class="progress-header">
        <h2>Target Tabungan</h2>
        <span id="progressText">Rp0 / Rp5.000.000</span>
      </div>

      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card income">
        <p>Pemasukan</p>
        <h3 id="incomeTotal">Rp0</h3>
      </div>

      <div class="stat-card expense">
        <p>Pengeluaran</p>
        <h3 id="expenseTotal">Rp0</h3>
      </div>

      <div class="stat-card invest">
        <p>Investasi</p>
        <h3 id="investTotal">Rp0</h3>
      </div>
    </div>

    <div class="glass form-box">
      <h2>Tambah Transaksi</h2>

      <input type="text" id="desc" placeholder="Contoh: Kopi" />

      <input type="number" id="amount" placeholder="Nominal" />

      <select id="type">
        <option value="income">Pemasukan</option>
        <option value="expense">Pengeluaran</option>
        <option value="invest">Investasi</option>
      </select>

      <button onclick="addTransaction()">Tambah</button>
    </div>

    <div class="glass filter-box">
      <input type="text" id="searchInput" placeholder="Cari transaksi..." onkeyup="renderTransactions()" />

      <select id="filterType" onchange="renderTransactions()">
        <option value="all">Semua</option>
        <option value="income">Pemasukan</option>
        <option value="expense">Pengeluaran</option>
        <option value="invest">Investasi</option>
      </select>
    </div>

    <div class="glass history-box">
      <div class="history-header">
        <h2>Riwayat Transaksi</h2>

        <button class="download-btn" onclick="downloadData()">
          Download Backup
        </button>
      </div>

      <div id="transactionList"></div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
